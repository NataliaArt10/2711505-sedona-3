<div class="modal-container" data-test="modal">
      <div class="modal modal-search">
        <button class="modal-closure-button" type="button">
          <span class="visually-hidden">Закрыть</span>
        </button>
        <section class="modal-content">
          <h2 class="modal-title">Поиск гостиницы в Седоне</h2>
          <form class="modal-search-form" action="https://echo.htmlacademy.ru/" method="post">
            <div class="field-group">
              <label class="modal-field-label" for="chek-in-date">Дата заезда:</label>
              <div class="check-wrapper">
                <input class="modal-search-field field" type="text" id="chek-in-date" name="chek-in-date"
                  placeholder="Укажите дату" value="27 апреля 2020">
                <span class="form-notification invalid-notification">Мы не можем отправить вас в прошлое.</span>
              </div>
            </div>
            <div class="field-group">
              <label class="modal-field-label" for="chek-out-date">Дата выезда:</label>
              <div class="check-wrapper">
                <input class="modal-search-field field" type="text" id="chek-out-date" name="chek-out-date"
                  placeholder="Укажите дату" value="1 сентября 2023">
                <span class="form-notification">На эти даты есть свободные номера. Пока есть.</span>
              </div>
            </div>
            <div class="guest-form">
              <div class="guest-wrapper adult-wrapper">
                <label class="modal-field-label modal-field-label-adults" for="adults">Взрослые:</label>
                <div class="button-wrapper">
                  <button type="button" class="minus">
                    <span class="visually-hidden">Уменьшить количество</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="rgba(117, 97, 87, 0.3)"
                      xmlns="http://www.w3.org/2000/svg">
                      <path d="M3 9V11H17V9H3Z"></path>
                    </svg>
                  </button>
                  <input class="modal-form-input" id="adults" name="adults" type="number" value="2" min="1" max="1000">
                  <button type="button" class="plus">
                    <span class="visually-hidden">Увеличить количество</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="rgba(117, 97, 87, 0.3)"
                      xmlns="http://www.w3.org/2000/svg">
                      <path d="M17 9H11V3H9V9H3V11H9V17H11V11H17V9Z"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="guest-wrapper">
                <div class="child-label-wrapper">
                  <label class="modal-field-label modal-field-label-children" for="children">Дети:</label>
                  <span class="tooltip">
                    <button type="button" class="tooltip-button" aria-labelledby="tooltip-label-count">
                      <span class="visually-hidden">Подробная информация</span>
                    </button>
                    <span class="tooltip-text" role="tooltip" id="tooltip-label-count">Укажите количество детей, которые
                      будут с вами, возраст которых от 6 до 18 лет. Дети до 6 лет размещаются бесплатно.
                    </span>
                  </span>
                </div>
                <div class="button-wrapper">
                  <button type="button" class="minus">
                    <span class="visually-hidden">Уменьшить количество</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="rgba(117, 97, 87, 0.3)"
                      xmlns="http://www.w3.org/2000/svg">
                      <path d="M3 9V11H17V9H3Z"></path>
                    </svg>
                  </button>
                  <input class="modal-form-input" id="children" name="children" type="number" value="2" min="1"
                    max="1000">
                  <button type="button" class="plus">
                    <span class="visually-hidden">Увеличить количество</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="rgba(117, 97, 87, 0.3)"
                      xmlns="http://www.w3.org/2000/svg">
                      <path d="M17 9H11V3H9V9H3V11H9V17H11V11H17V9Z"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <button type="submit" class="button button-blue modal-submit">Найти</button>
          </form>
        </section>
      </div>
    </div>
